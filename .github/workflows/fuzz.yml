# Fuzzing (T01.14, STRATEGIE_DE_TESTS.md sections 5 and 13.2, ENF-SEC-03).
# Nightly: 1 hour per target from the growing corpus; a crash opens a ticket.
# Pull requests touching the targets: 60 seconds per target.

name: fuzz

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "fuzz/**"
      - "crates/ndaal-fuzz/**"
      - ".github/workflows/fuzz.yml"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  # A newer push cancels the run of a pull request; a run in progress on
  # main is never cancelled (P-08). GitHub still keeps one pending run per
  # group, so a third run drops the pending one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  targets:
    name: targets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: List targets
        id: list
        shell: bash
        # One target per [[bin]] of fuzz/Cargo.toml, as cargo fuzz list does.
        run: |
          list="$(sed -n 's/^name = "\(.*\)"$/\1/p' fuzz/Cargo.toml | grep -v '^ndaal-fuzz-targets$' \
            | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')"
          echo "targets: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

  fuzz:
    name: fuzz (${{ matrix.target }})
    needs: targets
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.targets.outputs.list) }}
    env:
      TARGET: ${{ matrix.target }}
      SECONDS_PER_TARGET: ${{ github.event_name == 'pull_request' && '60' || '3600' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
          key: ${{ hashFiles('scripts/tools.versions', 'fuzz/rust-toolchain.toml') }}
      - name: Restore the corpus of previous nights
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz
        id: fuzz
        shell: bash
        run: ./scripts/fuzz.sh "$TARGET" "$SECONDS_PER_TARGET"
      - name: Save the corpus
        if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - name: Upload the corpus (to bring it back into git with cargo fuzz cmin)
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: fuzz/corpus/${{ matrix.target }}
          retention-days: 14
      - name: Upload the crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/
      - name: Open or update the ticket
        # Only for a finding: a build or install failure leaves no input in
        # fuzz/artifacts/ and fails the run without a crash ticket.
        if: >-
          failure() && steps.fuzz.outcome == 'failure' && github.event_name != 'pull_request'
          && hashFiles('fuzz/artifacts/**') != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="fuzz: crash in $TARGET"
          body="Nightly fuzzing of \`$TARGET\` failed: $RUN_URL (crashing input in the \`fuzz-crash-$TARGET\` artifact). Reproduce with \`cargo fuzz run $TARGET <input>\`; the fix comes with the input added to \`fuzz/corpus/$TARGET/\`."
          gh label create fuzz --description "Fuzzing finding" --color B60205 2>/dev/null || true
          existing="$(gh issue list --state open --label fuzz --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label fuzz --body "$body"
          fi
