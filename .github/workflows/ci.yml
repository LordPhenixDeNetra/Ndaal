# Continuous integration (STRATEGIE_DE_TESTS.md section 13.1, ADR-028).
# Every check is a repository script or cargo command, so it can be run locally.

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push cancels the run of a pull request; a run in progress on
  # main is never cancelled (P-08). GitHub still keeps one pending run per
  # group, so a third run drops the pending one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Tools are cached in ~/.cargo/bin: a new pinned version needs a new key.
          key: ${{ hashFiles('scripts/tools.versions') }}
      - name: Install pinned tools
        shell: bash
        run: ./scripts/install-tools.sh cargo-deny
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Hygiene
        shell: bash
        run: ./scripts/check-hygiene.sh
      - name: Documentation links
        shell: bash
        run: ./scripts/check-links.sh
      - name: Side-effect lint list (ADR-017)
        shell: bash
        run: ./scripts/check-lint.sh
      - name: Dependencies (cargo deny)
        shell: bash
        run: ./scripts/check-deny.sh

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Tools are cached in ~/.cargo/bin: a new pinned version needs a new key.
          key: ${{ hashFiles('scripts/tools.versions') }}
      - name: Install pinned tools
        shell: bash
        run: ./scripts/install-tools.sh cargo-nextest
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo nextest run --workspace
      # T02.06: the disk backends pass their contract on ext4 (the runner's
      # file system, above) and on XFS, mounted from a loop file here. A
      # missing mkfs.xfs fails the step: never a silent skip.
      - name: Disk contract on XFS
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v mkfs.xfs >/dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y -q xfsprogs
          fi
          truncate -s 1G "$RUNNER_TEMP/xfs.img"
          mkfs.xfs -q "$RUNNER_TEMP/xfs.img"
          mkdir -p "$RUNNER_TEMP/xfs"
          sudo mount -o loop "$RUNNER_TEMP/xfs.img" "$RUNNER_TEMP/xfs"
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/xfs"
          test "$(stat -f -c %T "$RUNNER_TEMP/xfs")" = xfs
          NDAAL_TEST_DIR="$RUNNER_TEMP/xfs" \
            cargo nextest run -p ndaal-io --test real_disk --test real_pool
      - name: Benchmarks run once (they must keep working)
        if: runner.os == 'Linux'
        run: cargo bench --workspace --bench '*' -- --test
      - name: Hygiene (line endings and paths as checked out on this system)
        shell: bash
        run: ./scripts/check-hygiene.sh

  dco:
    name: dco
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Developer Certificate of Origin
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/check-dco.sh "$BASE_SHA" "$HEAD_SHA"

  coverage:
    name: coverage
    # Also on main: its cache is the only one every pull request can restore.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Tools are cached in ~/.cargo/bin: a new pinned version needs a new key.
          key: ${{ hashFiles('scripts/tools.versions') }}
      - name: Install pinned tools
        shell: bash
        run: ./scripts/install-tools.sh cargo-nextest cargo-llvm-cov
      - name: Coverage report
        run: cargo llvm-cov nextest --workspace --lcov --output-path lcov.info
      - name: Coverage summary
        shell: bash
        run: |
          {
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: lcov.info

  docker:
    name: docker
    # T01.22: the image builds, the node becomes healthy and stops on SIGTERM.
    # GitHub runs Linux containers on Linux only: macOS and Windows are
    # checked locally with Docker Desktop.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE: docker compose -f deploy/docker/compose.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and start a node (waits for the HEALTHCHECK)
        run: $COMPOSE up --detach --build --wait --wait-timeout 180
      - name: Readiness from the host
        run: curl --fail --silent --show-error http://127.0.0.1:8080/health/ready
      - name: Graceful stop on SIGTERM (exit code 0, not killed)
        shell: bash
        run: |
          container="$($COMPOSE ps --all --quiet ndaal)"
          $COMPOSE stop --timeout 5
          code="$(docker inspect --format '{{.State.ExitCode}}' "$container")"
          echo "exit code: $code"
          test "$code" = 0
      - name: Logs
        if: failure()
        run: $COMPOSE logs
      - name: Clean up
        if: always()
        run: $COMPOSE down --volumes
