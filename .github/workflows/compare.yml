# Comparative benchmarks (T01.18, STRATEGIE_DE_TESTS.md section 9.4, ADR-027).
# Nightly short version on a GitHub-hosted runner until the reference
# machines exist (D-05, P-50): Valkey against itself for now. A result beyond
# the ENF-COMP tolerance opens or updates a ticket.

name: compare

on:
  schedule:
    # After the micro-benchmarks (bench.yml, 03:00 UTC).
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      simulate_regression:
        description: "Limit the candidate to 30 % of a core: must open the ticket"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: compare
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  kv:
    name: kv
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build xtask
        run: cargo build --quiet -p xtask
      - name: Run the reference and the candidate
        shell: bash
        env:
          SIMULATE: ${{ inputs.simulate_regression && '0.3' || '' }}
        # 4 vCPUs: server on cpu 0, client on cpus 2-3.
        run: |
          quota=()
          if [ -n "$SIMULATE" ]; then quota=(--candidate-cpu-quota "$SIMULATE"); fi
          bench/compare/kv.sh --server-cpus 0 --client-cpus 2,3 --duration 60 --repeats 5 \
            --out results "${quota[@]}"
      - name: Compare
        id: compare
        shell: bash
        run: |
          set +e
          cargo run --quiet -p xtask -- compare results
          code=$?
          cat results/report.md >> "$GITHUB_STEP_SUMMARY"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 1 = beyond tolerance (handled below); anything else (2 = invalid
          # input, 101 = panic or build failure) fails here, without ticket.
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then exit "$code"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: compare-kv
          path: results/
          retention-days: 30
      - name: Open or update the ticket
        if: steps.compare.outputs.code == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="compare: kv beyond tolerance"
          body="$(printf 'Run: %s\n\n%s' "$RUN_URL" "$(cat results/report.md)")"
          gh label create perf --description "Performance regression" --color D93F0B 2>/dev/null || true
          existing="$(gh issue list --state open --label perf --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label perf --body "$body"
          fi
      - name: Fail beyond tolerance
        if: steps.compare.outputs.code == '1'
        run: exit 1
