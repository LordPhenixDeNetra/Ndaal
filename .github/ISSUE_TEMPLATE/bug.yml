name: Bug report
description: Something does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security vulnerabilities must NOT be reported here: use the private form described in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Ndaal version or commit
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system and architecture
      placeholder: "Linux 6.8 x86_64, macOS 15 arm64, Windows 11 x86_64..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands, client used (redis-cli, aws-cli, SDK...), minimal data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Link the requirement (EF-..., ENF-...) or documentation section if you can.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines, with secrets, keys and tokens removed.
      render: text
