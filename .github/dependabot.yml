# Automatic dependency updates (ENF-QUAL-07, CLAUDE.md section 4.12).
# Each update is reviewed like code: release notes, full CI, benchmarks.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
