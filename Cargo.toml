[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# cargo fuzz workspace, built with its own nightly (fuzz/rust-toolchain.toml).
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/LordPhenixDeNetra/Ndaal"
publish = false

[workspace.dependencies]
# Centralized dependency versions (T01.01). Exact versions are pinned by Cargo.lock.
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
core_affinity = "0.8.3"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
clap = { version = "4.6.7", default-features = false, features = ["std"] }
fluent-bundle = "0.16.0"
fluent-syntax = "0.12.0"
getrandom = "0.4.3"
libc = "0.2.190"
ndaal-common = { path = "crates/ndaal-common", version = "0.0.0" }
ndaal-fuzz = { path = "crates/ndaal-fuzz", version = "0.0.0" }
ndaal-i18n = { path = "crates/ndaal-i18n", version = "0.0.0" }
ndaal-io = { path = "crates/ndaal-io", version = "0.0.0" }
ndaal-observe = { path = "crates/ndaal-observe", version = "0.0.0" }
ndaal-runtime = { path = "crates/ndaal-runtime", version = "0.0.0" }
ndaal-proto-http = { path = "crates/ndaal-proto-http", version = "0.0.0" }
proptest = "1.12.0"
rtrb = "0.4.0"
sys-locale = "0.3.2"
tempfile = "3.27.0"
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.2", default-features = false }
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "display", "serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false }
unic-langid = "0.9.6"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
too_many_lines = "warn"
too_many_arguments = "warn"
cognitive_complexity = "warn"
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"

# ADR-030: a panic is a bug; the process stops and restarts from its log.
# (Cargo ignores this for tests, which keep unwinding.)
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
