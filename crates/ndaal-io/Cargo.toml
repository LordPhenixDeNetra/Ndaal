[package]
name = "ndaal-io"
description = "Time, disk, network and randomness abstractions with real and simulated implementations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Pinning of the I/O threads to the io cores (real::IoPool).
core_affinity.workspace = true
getrandom.workspace = true
# Metrics ndaal_io_* of the I/O pool; ndaal-observe depends on ndaal-common only.
ndaal-observe.workspace = true
# Lock-free submission queues of the I/O pool (ADR-003).
rtrb.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "time", "net", "io-util", "signal", "macros", "sync"] }

[target.'cfg(target_os = "linux")'.dependencies]
# fallocate (File::allocate); std has no wrapper.
libc.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time", "net", "io-util"] }

[lints]
workspace = true
