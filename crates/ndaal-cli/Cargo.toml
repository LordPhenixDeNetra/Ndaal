[package]
name = "ndaal-cli"
description = "The ndaal binary: server, client, administration, backup, benchmarks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "ndaal"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["help", "usage", "error-context", "string"] }
ndaal-common.workspace = true
ndaal-i18n.workspace = true
ndaal-io.workspace = true
ndaal-observe.workspace = true
sys-locale.workspace = true
tokio = { workspace = true, features = ["rt", "signal"] }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt"] }

[lints]
workspace = true
